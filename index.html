    <script>(function(s){s.dataset.zone='11581417',s.src='https://nap5k.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>

    <!-- Adsterra Social Bar -->
    <script src="https://manyapostle.com/87/7a/ba/877aba152b8fea01881972d9c95d3a82.js"></script>

    <!-- Theme & Firebase Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, orderBy, doc, updateDoc, increment, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        // Firebase Init
        const app = initializeApp({
            apiKey: "AIzaSyAwUj723MNESN598J3txayWeoiDhtp6P5I",
            authDomain: "anime-hindi-40e2b.firebaseapp.com",
            projectId: "anime-hindi-40e2b"
        });
        const db = getFirestore(app);

        window.moviesData = [];
        window.scheduleData = [];
        let userHistory = JSON.parse(localStorage.getItem('animeHistory')) || [];
        let userSaved = JSON.parse(localStorage.getItem('animeSaved')) || [];
        const oneWeekMs = 7 * 24 * 60 * 60 * 1000;
        const oneDayMs = 24 * 60 * 60 * 1000;

        // THEME
        window.toggleTheme = function() {
            const docEl = document.documentElement;
            if (docEl.getAttribute("data-theme") === "dark") { docEl.removeAttribute("data-theme"); localStorage.setItem("theme", "light"); } 
            else { docEl.setAttribute("data-theme", "dark"); localStorage.setItem("theme", "dark"); }
        };
        if (localStorage.getItem("theme") === "dark") document.documentElement.setAttribute("data-theme", "dark");

        // NAVIGATION
        window.switchPage = function(page, pushState = true) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn:not(.theme-btn):not(.menu-btn)').forEach(el => el.classList.remove('active'));
            if(page==='home') { document.getElementById('homeView').classList.add('active'); document.getElementById('btnHome').classList.add('active'); }
            else if(page==='schedule') { document.getElementById('scheduleView').classList.add('active'); document.getElementById('btnSchedule').classList.add('active'); }
            else if(page==='details') { document.getElementById('detailsView').classList.add('active'); window.scrollTo(0,0); }
            else if(page==='episodes') { document.getElementById('episodesView').classList.add('active'); window.scrollTo(0,0); }
            else if(page==='help') { document.getElementById('helpView').classList.add('active'); window.scrollTo(0,0); }
            if (pushState) history.pushState({ page: page }, "", "#" + page);
        }
        window.addEventListener('popstate', (e) => { switchPage(e.state ? e.state.page : 'home', false); });

        // SIDEBAR LOGIC
        window.toggleMenu = function() {
            document.getElementById('sideMenu').classList.toggle('open');
            document.getElementById('menuOverlay').classList.toggle('open');
            renderSidebar();
        }
        window.switchMenuTab = function(tab) {
            document.getElementById('tabHistory').classList.remove('active');
            document.getElementById('tabSaved').classList.remove('active');
            if(tab === 'history') { document.getElementById('tabHistory').classList.add('active'); renderSidebar('history'); }
            else { document.getElementById('tabSaved').classList.add('active'); renderSidebar('saved'); }
        }
        function renderSidebar(tab = document.getElementById('tabHistory').classList.contains('active') ? 'history' : 'saved') {
            const content = document.getElementById('sidebarContent');
            let list = tab === 'history' ? userHistory : userSaved;
            if(list.length === 0) { content.innerHTML = `<p style="color:var(--text-muted); text-align:center; margin-top:20px;">No animes here yet.</p>`; return; }
            
            let html = '';
            list.forEach(id => {
                let m = window.moviesData.find(x => x.id === id);
                if(m) {
                    html += `
                    <div class="small-card" onclick="openDetails('${m.id}'); toggleMenu();">
                        <img src="${m.cover}" alt="cover">
                        <div class="small-card-info">
                            <h4>${m.title}</h4>
                            <span style="font-size:11px; color:var(--primary);">👁️ ${m.views || 0} Views</span>
                        </div>
                    </div>`;
                }
            });
            content.innerHTML = html;
        }

        // FETCH DATA
        onSnapshot(query(collection(db, "animes"), orderBy("createdAt", "desc")), (snapshot) => {
            window.scheduleData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            renderSchedule();
        });

        onSnapshot(query(collection(db, "movies"), orderBy("createdAt", "desc")), (snapshot) => {
            window.moviesData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            renderMovies();
            if(document.getElementById('sideMenu').classList.contains('open')) renderSidebar();
        });

        // RENDER MOVIES WITH SEARCH LOGIC
        function renderMovies() {
            const grid = document.getElementById('movieGrid'); grid.innerHTML = '';
            
            const searchTerm = document.getElementById('homeSearch') ? document.getElementById('homeSearch').value.toLowerCase() : '';

            let sorted = [...window.moviesData].sort((a, b) => {
                if (a.pinned && !b.pinned) return -1; if (!a.pinned && b.pinned) return 1;
                return (b.updatedAt || b.createdAt) - (a.updatedAt || a.createdAt); 
            });

            const now = Date.now();
            let count = 0;

            sorted.forEach((m) => {
                if(!m.title) return; 
                if(searchTerm && !m.title.toLowerCase().includes(searchTerm)) return; 
                
                count++;
                let newHtml = (m.newUntil && m.newUntil > now) ? `<div class="new-badge">🔥 NEW</div>` : '';
                
                let badges = '';
                if(m.quality) badges += `<span class="lang-badge lang-quality">${m.quality}</span>`;
                if(m.lang_hi) badges += '<span class="lang-badge lang-hi">HI</span>';
                if(m.lang_en) badges += '<span class="lang-badge">EN</span>';
                if(m.lang_jp) badges += '<span class="lang-badge">JP</span>';
                if(m.lang_zh) badges += '<span class="lang-badge" style="background:#f97316;">ZH</span>';
                if(m.lang_ta) badges += '<span class="lang-badge" style="background:#8b5cf6;">TA</span>';
                if(m.lang_te) badges += '<span class="lang-badge" style="background:#ec4899;">TE</span>';
                if(m.lang_ml) badges += '<span class="lang-badge" style="background:#10b981;">ML</span>';
                if(m.lang_bn) badges += '<span class="lang-badge" style="background:#3b82f6;">BN</span>';
                if(m.lang_kn) badges += '<span class="lang-badge" style="background:#eab308; color:#000;">KN</span>';
                if(m.sub_hi || m.sub_en || m.sub_jp) badges += '<span class="lang-badge lang-cc">CC</span>';

                grid.innerHTML += `
                    <div class="movie-card" onclick="openDetails('${m.id}')">
                        <div class="movie-poster-wrapper">
                            <img src="${m.cover}" class="movie-poster">
                            ${m.pinned ? `<div class="pin-badge">📌 Pinned</div>` : ''} ${newHtml}
                            <div class="movie-langs">${badges}</div>
                        </div>
                        <div class="movie-title-box">
                            <h3 class="movie-title">${m.title}</h3>
                            <div class="card-stats"><span>👁️ ${m.views || 0}</span> <span>⬇️ ${m.downloads || 0}</span></div>
                        </div>
                    </div>`;
            });

            if(count === 0) grid.innerHTML = '<div style="color:var(--text-muted); text-align:center; grid-column: span 2;">No anime found.</div>';
        }

        // Attach event listener for Home Search Bar
        document.getElementById('homeSearch').addEventListener('input', renderMovies);

        // ACTIONS LOGIC
        window.openDetails = async function(id) {
            const movie = window.moviesData.find(m => m.id === id); if(!movie) return;
            const dateStr = new Date(movie.updatedAt || movie.createdAt).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            
            if(!userHistory.includes(id)) {
                userHistory.unshift(id); if(userHistory.length > 20) userHistory.pop();
                localStorage.setItem('animeHistory', JSON.stringify(userHistory));
                await updateDoc(doc(db, "movies", id), { views: increment(1) });
            }

            let isSaved = userSaved.includes(id);
            let likedKey = localStorage.getItem('liked_' + id);

            document.getElementById('detailsContent').innerHTML = `
                <img src="${movie.cover}" class="details-poster">
                <h1 class="details-title">${movie.title}</h1>
                <div class="details-meta">Updated: ${dateStr}</div>

                <div class="stats-row">
                    <span>👁️ ${movie.views || 0} Views</span>
                    <span>⬇️ ${movie.downloads || 0} Downloads</span>
                    <span>❤️ <span id="likeText_${id}">${movie.likes || 0}</span> Likes</span>
                </div>

                <div class="action-bar">
                    <button class="action-btn ${likedKey ? 'active' : ''}" onclick="toggleLike('${id}')" id="btnLike_${id}">
                        ${likedKey ? '❤️ Liked' : '🤍 Like'}
                    </button>
                    <button class="action-btn ${isSaved ? 'active-save' : ''}" onclick="toggleSave('${id}')" id="btnSave_${id}">
                        ${isSaved ? '🔖 Saved' : '📑 Save'}
                    </button>
                </div>

                <button onclick="openEpisodes('${id}')" class="btn-primary">View Episodes & Download</button>

                <div class="section-heading">Synopsis</div>
                <div class="details-desc">${movie.synopsis || 'Overview unavailable.'}</div>
                
                <div class="section-heading">Information</div>
                <ul class="info-list">
                    <li><strong>Format:</strong> <span class="info-val">Season ${movie.season || '1'}</span></li>
                    <li><strong>Episodes:</strong> <span class="info-val">${movie.episodes || 'TBA'}</span></li>
                    <li><strong>Year:</strong> <span class="info-val">${movie.year || '2026'}</span></li>
                    <li><strong>Quality:</strong> <span class="info-val"><span style="color:#ef4444; font-weight:700;">${movie.quality || '1080p'}</span></span></li>
                    <li><strong>Genre:</strong> <span class="info-val">${movie.genre || 'Action, Animation'}</span></li>
                    <li><strong>Audio:</strong> <span class="info-val"><span style="color:var(--primary); font-weight:700;">${movie.audioInfo || 'Original'}</span></span></li>
                    <li><strong>Subtitle:</strong> <span class="info-val"><span style="color:#0ea5e9; font-weight:700;">${movie.subtitleInfo || 'None'}</span></span></li>
                </ul>
            `;
            switchPage('details');
        }

        window.toggleLike = async function(id) {
            let btn = document.getElementById(`btnLike_${id}`); let text = document.getElementById(`likeText_${id}`);
            let isLiked = localStorage.getItem('liked_' + id);
            if(!isLiked) {
                localStorage.setItem('liked_' + id, 'true');
                btn.classList.add('active'); btn.innerHTML = '❤️ Liked'; text.innerText = parseInt(text.innerText) + 1;
                await updateDoc(doc(db, "movies", id), { likes: increment(1) });
            } else {
                localStorage.removeItem('liked_' + id);
                btn.classList.remove('active'); btn.innerHTML = '🤍 Like'; text.innerText = parseInt(text.innerText) - 1;
                await updateDoc(doc(db, "movies", id), { likes: increment(-1) });
            }
        }

        window.toggleSave = function(id) {
            let btn = document.getElementById(`btnSave_${id}`); let index = userSaved.indexOf(id);
            if(index === -1) { userSaved.unshift(id); btn.classList.add('active-save'); btn.innerHTML = '🔖 Saved'; } 
            else { userSaved.splice(index, 1); btn.classList.remove('active-save'); btn.innerHTML = '📑 Save'; }
            localStorage.setItem('animeSaved', JSON.stringify(userSaved));
        }

        window.openEpisodes = function(id) {
            const movie = window.moviesData.find(m => m.id === id);
            const content = document.getElementById('episodesContent');
            let html = `<h1 class="episodes-main-title">Episodes</h1>
                <a href="https://t.me/ANIME_HIN1" target="_blank" class="tele-banner">
                    <div class="tele-icon"><svg viewBox="0 0 24 24"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg></div>
                    <div class="tele-text"><h4>Join Our Telegram</h4><p>Get the latest updates!</p></div>
                </a>`;
            if(movie.episodesList && movie.episodesList.length > 0) {
                movie.episodesList.forEach(ep => {
                    html += `
                    <div class="episode-block">
                        <div class="ep-num">Episode ${ep.epNum}</div>
                        <button onclick="trackDownload('${movie.id}', '${ep.link}')" class="ep-download-btn">Watch / Download</button>
                    </div>`;
                });
            } else { html += '<p style="text-align:center;">No episodes yet.</p>'; }
            content.innerHTML = html; switchPage('episodes');
        }

        window.trackDownload = async function(id, link) {
            window.open(link, '_blank');
            await updateDoc(doc(db, "movies", id), { downloads: increment(1) });
        }

        // SCHEDULE
        function renderSchedule() {
            const ongoingList = document.getElementById('ongoingList'); const upcomingList = document.getElementById('upcomingList');
            ongoingList.innerHTML = ''; upcomingList.innerHTML = '';
            const search = document.getElementById('searchInput').value.toLowerCase();
            const now = new Date().getTime();
            let ongoingArr = []; let upcomingArr = [];

            window.scheduleData.forEach((anime, index) => {
                if(!anime.title || !anime.title.toLowerCase().includes(search)) return;
                const isUpcoming = (anime.status === 'upcoming');
                if(isUpcoming) {
                    let distance = anime.targetDate - now;
                    if(distance > 0) upcomingArr.push({...anime, distance, originalIndex: index});
                } else {
                    let nextAirTime = anime.targetDate; let epOffset = 0; let step = (anime.status === 'daily') ? oneDayMs : oneWeekMs;
                    while (nextAirTime <= now) { nextAirTime += step; epOffset++; }
                    let distance = nextAirTime - now; let currentEpisode = parseInt(anime.episode || 1) + epOffset;
                    ongoingArr.push({...anime, distance, currentEpisode, originalIndex: index});
                }
            });

            ongoingArr.sort((a, b) => a.distance - b.distance); upcomingArr.sort((a, b) => a.distance - b.distance);

            const buildCard = (anime, isUpc) => {
                const dateObj = new Date(anime.targetDate);
                const dayName = dateObj.toLocaleDateString('en-US', { weekday: 'short' });
                const timeString = dateObj.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
                let tags = ''; if(anime.languages) anime.languages.forEach(l => tags += `<span class="tag">${l}</span>`);
                return `
                    <div class="sched-card">
                        <div class="sched-top"><img src="${anime.cover}" class="sched-cover"><div class="sched-info"><h3>${anime.title}</h3><div class="tags"><span class="tag" id="ep-${anime.originalIndex}" style="color:white; background:var(--primary); border:none;">${isUpc ? 'Soon' : 'EP '+anime.currentEpisode}</span>${tags}</div><div style="font-size:12px; color:var(--text-muted); font-weight:600;">${dayName}, ${timeString}</div></div></div>
                        <div class="countdown"><div class="time-box"><span id="d-${anime.originalIndex}">0</span><small>D</small></div><div class="time-box"><span id="h-${anime.originalIndex}">0</span><small>H</small></div><div class="time-box"><span id="m-${anime.originalIndex}">0</span><small>M</small></div><div class="time-box"><span id="s-${anime.originalIndex}">0</span><small>S</small></div></div>
                    </div>`;
            };
            if(ongoingArr.length === 0) ongoingList.innerHTML = '<div style="text-align:center;">No active simulcasts.</div>'; else ongoingArr.forEach(a => ongoingList.innerHTML += buildCard(a, false));
            if(upcomingArr.length === 0) upcomingList.innerHTML = '<div style="text-align:center;">No upcoming simulcasts.</div>'; else upcomingArr.forEach(a => upcomingList.innerHTML += buildCard(a, true));
            updateTimers(true);
        }

        window.updateTimers = function(skipRender = false) {
            const now = new Date().getTime(); let needsRerender = false; 
            window.scheduleData.forEach((anime, index) => {
                const elD = document.getElementById(`d-${index}`); if(!elD) return; 
                const isUpcoming = (anime.status === 'upcoming'); let distance = 0;
                if(isUpcoming) { distance = anime.targetDate - now; if(distance <= 0) needsRerender = true; } 
                else {
                    let nextAirTime = anime.targetDate; let epOffset = 0; let step = (anime.status === 'daily') ? oneDayMs : oneWeekMs;
                    while (nextAirTime <= now) { nextAirTime += step; epOffset++; }
                    distance = nextAirTime - now; let currentEpisode = parseInt(anime.episode || 1) + epOffset;
                    let epBadge = document.getElementById(`ep-${index}`);
                    if(epBadge && epBadge.innerText !== 'EP ' + currentEpisode) epBadge.innerText = 'EP ' + currentEpisode;
                }
                if(distance < 0) distance = 0;
                document.getElementById(`d-${index}`).innerText = Math.floor(distance / (1000 * 60 * 60 * 24)).toString().padStart(2, '0');
                document.getElementById(`h-${index}`).innerText = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)).toString().padStart(2, '0');
                document.getElementById(`m-${index}`).innerText = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60)).toString().padStart(2, '0');
                document.getElementById(`s-${index}`).innerText = Math.floor((distance % (1000 * 60)) / 1000).toString().padStart(2, '0');
            });
            if(needsRerender && !skipRender) renderSchedule();
        }
        document.getElementById('searchInput').addEventListener('input', renderSchedule);
        setInterval(() => window.updateTimers(false), 1000);

        // CONTACT FORM
        window.sendMessage = async function() {
            const name = document.getElementById('helpName').value.trim(); const email = document.getElementById('helpEmail').value.trim();
            const subject = document.getElementById('helpSubject').value.trim(); const msg = document.getElementById('helpMsg').value.trim();
            const btn = document.getElementById('btnSendHelp');
            if(!name || !email || !subject || !msg) { alert("Please fill in all fields!"); return; }
            try {
                btn.innerHTML = "Sending..."; btn.disabled = true;
                await addDoc(collection(db, "messages"), { name: name, email: email, subject: subject, message: msg, createdAt: new Date().getTime() });
                alert("Message sent successfully!");
                document.getElementById('helpName').value=''; document.getElementById('helpEmail').value=''; document.getElementById('helpSubject').value=''; document.getElementById('helpMsg').value='';
            } catch(e) { console.error(e); alert("Error sending message."); } 
            finally { btn.innerHTML = "Send Message"; btn.disabled = false; }
        }
    </script>

    <!-- Invisible Popunder (30s delay logic) -->
    <script>
        (function() {
            function checkAndLoadPopunder() {
                var lastClickTime = sessionStorage.getItem("popunder_last_click") || 0;
                var now = new Date().getTime();
                if (now - lastClickTime >= 30000) {
                    var script = document.createElement("script");
                    script.src = "https://manyapostle.com/bf/a5/ac/bfa5ac4bf3fc88a75a56eac14aa7c884.js";
                    script.async = true; document.body.appendChild(script);
                    document.body.addEventListener("click", function clickHandler() {
                        sessionStorage.setItem("popunder_last_click", new Date().getTime());
                        document.body.removeEventListener("click", clickHandler);
                    }, { once: true });
                }
            }
            checkAndLoadPopunder();
            window.addEventListener('popstate', checkAndLoadPopunder);
        })();
    </script>
